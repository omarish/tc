name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -o tc .

      - name: Smoke
        run: |
          echo -n hello | ./tc | grep -qx 1
          ./tc -h | grep -q 'Usage: tc'
